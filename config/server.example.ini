# opends2server configuration
# Copy to server.ini (git-ignored) and run: opends2server --config config/server.ini

# Interface to listen on.
bind_address = 0.0.0.0

# Where the game's redirector lookup lands once its DNS is pointed at this machine.
# 42127 is what ME3-era Blaze titles used; confirm for Dead Space 2.
redirector_port = 42127

# Main Blaze server port. Arbitrary: the redirector tells clients which port to use.
blaze_port = 10041

# Address the redirector hands to the game. Must be reachable from the game client.
public_host = 127.0.0.1

# trace | debug | info | warn | error   (trace logs every payload; use it when reverse engineering)
log_level = debug
